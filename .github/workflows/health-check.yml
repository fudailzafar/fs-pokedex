name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed service health
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-pokedex-yhgv.onrender.com/health
          follow-redirect: true
          max-attempts: 3
          retry-delay: 10s
