name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  quality_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check style
        run: npm run eslint

      - name: Run npm test
        run: npm test

      - name: Run npm build
        run: npm run build

  e2e_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

  deploy:
    needs: [quality_checks, e2e_tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(toJSON(github.event.commits), '#skip')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: curl -fsS "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(toJSON(github.event.commits), '#skip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: main

  notify:
    needs: [quality_checks, e2e_tests, deploy, tag_release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify successful deployment
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.quality_checks.result == 'success' &&
          needs.e2e_tests.result == 'success' &&
          needs.deploy.result == 'success' &&
          needs.tag_release.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Success
          title: Deployment succeeded
          description: >-
            A new version was deployed from commit
            [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

      - name: Notify failed build
        if: >-
          needs.quality_checks.result == 'failure' ||
          needs.e2e_tests.result == 'failure' ||
          needs.deploy.result == 'failure' ||
          needs.tag_release.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Failure
          title: CI pipeline failed
          description: >-
            The pipeline failed for commit
            [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).
            Check the workflow logs for the failing step.